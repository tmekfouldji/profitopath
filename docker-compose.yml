name: profitopath-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profitopath
      POSTGRES_PASSWORD: profitopath_dev
      POSTGRES_USER: profitopath
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U profitopath -d profitopath']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
