name: profitopath-production-local

x-application-environment: &application-environment
  env_file:
    - .env.container.local
  # The web session signing secret is injected from the root .env, exactly as it would be
  # injected from one stable secret-manager value across production web replicas. This prevents a
  # browser session created by the local host-run app from becoming invalid after switching to the
  # Docker-shaped environment on the same localhost origin.
  environment:
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Copy .env.example to .env and set NEXTAUTH_SECRET before starting Docker Compose.}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profitopath
      POSTGRES_PASSWORD: profitopath_dev
      POSTGRES_USER: profitopath
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U profitopath -d profitopath']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *application-environment
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['sh', '-c', 'pnpm db:migrate:deploy && pnpm db:seed']
    depends_on:
      postgres:
        condition: service_healthy
    image: profitopath-migrate:local
    restart: 'no'

  web:
    <<: *application-environment
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/api/health/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    image: profitopath-web:local
    ports:
      - '3000:3000'
    restart: unless-stopped

  realtime:
    <<: *application-environment
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/health/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    image: profitopath-realtime:local
    ports:
      - '3001:3001'
    restart: unless-stopped

  worker:
    <<: *application-environment
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3002/health/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    image: profitopath-worker:local
    restart: unless-stopped

volumes:
  postgres_data:
